name: Versione web (GitHub Pages)
# Pubblica l'app su https://massimiliano1965.github.io/GiocaEImparaS/
# Una volta sola: Settings > Pages > Source = GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['www/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara la versione web
        run: sh web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
